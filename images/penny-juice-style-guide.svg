<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <!-- Background -->
  <rect width="1200" height="800" fill="#FFFFFF"/>
  
  <!-- Section dividers -->
  <line x1="0" y1="40" x2="1200" y2="40" stroke="#E0E0E0" stroke-width="1"/>
  <line x1="400" y1="40" x2="400" y2="800" stroke="#E0E0E0" stroke-width="1"/>
  <line x1="800" y1="40" x2="800" y2="800" stroke="#E0E0E0" stroke-width="1"/>
  <line x1="0" y1="410" x2="1200" y2="410" stroke="#E0E0E0" stroke-width="1"/>
  
  <!-- Section titles -->
  <text x="40" y="30" font-family="Montserrat, sans-serif" font-size="18" font-weight="bold" fill="#424242">01. LOGOS</text>
  <text x="440" y="30" font-family="Montserrat, sans-serif" font-size="18" font-weight="bold" fill="#424242">02. BUTTONS</text>
  <text x="840" y="30" font-family="Montserrat, sans-serif" font-size="18" font-weight="bold" fill="#424242">03. COLOR PALETTE</text>
  <text x="40" y="430" font-family="Montserrat, sans-serif" font-size="18" font-weight="bold" fill="#424242">04. TEXT STYLES</text>
  <text x="440" y="430" font-family="Montserrat, sans-serif" font-size="18" font-weight="bold" fill="#424242">05. ICONS</text>
  <text x="840" y="430" font-family="Montserrat, sans-serif" font-size="18" font-weight="bold" fill="#424242">06. CONTROLS</text>
  
  <!-- 01. LOGOS -->
  <!-- Primary logo -->
  <circle cx="120" cy="130" r="60" fill="#1E88E5"/>
  <circle cx="120" cy="130" r="40" fill="#FFFFFF"/>
  <path d="M120 90 Q150 110 120 130 Q90 150 120 170" fill="none" stroke="#43A047" stroke-width="12" stroke-linecap="round"/>
  <text x="80" y="240" font-family="Montserrat, sans-serif" font-size="40" font-weight="bold" fill="#1E88E5">PENNY</text>
  <text x="80" y="280" font-family="Montserrat, sans-serif" font-size="40" font-weight="bold" fill="#43A047">JUICE</text>
  
  <!-- Secondary logo -->
  <circle cx="120" cy="340" r="30" fill="#1E88E5"/>
  <circle cx="120" cy="340" r="20" fill="#FFFFFF"/>
  <path d="M120 320 Q135 330 120 340 Q105 350 120 360" fill="none" stroke="#43A047" stroke-width="6" stroke-linecap="round"/>
  <text x="160" y="350" font-family="Montserrat, sans-serif" font-size="26" font-weight="bold" fill="#1E88E5">PENNY JUICE</text>
  
  <!-- 02. BUTTONS -->
  <!-- Primary buttons -->
  <rect x="450" y="100" width="180" height="50" rx="6" ry="6" fill="#E91E63"/>
  <text x="540" y="132" font-family="Montserrat, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">ORDER NOW</text>
  
  <rect x="650" y="100" width="180" height="50" rx="6" ry="6" fill="#1E88E5"/>
  <text x="740" y="132" font-family="Montserrat, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">VIEW PRODUCTS</text>
  
  <!-- Secondary buttons -->
  <rect x="450" y="170" width="180" height="50" rx="6" ry="6" fill="#FFFFFF" stroke="#1E88E5" stroke-width="2"/>
  <text x="540" y="202" font-family="Montserrat, sans-serif" font-size="16" font-weight="bold" fill="#1E88E5" text-anchor="middle">LEARN MORE</text>
  
  <rect x="650" y="170" width="180" height="50" rx="6" ry="6" fill="#FFFFFF" stroke="#43A047" stroke-width="2"/>
  <text x="740" y="202" font-family="Montserrat, sans-serif" font-size="16" font-weight="bold" fill="#43A047" text-anchor="middle">CONTACT US</text>
  
  <!-- Button states -->
  <rect x="450" y="280" width="120" height="40" rx="20" ry="20" fill="#E3F2FD"/>
  <text x="510" y="306" font-family="Montserrat, sans-serif" font-size="14" fill="#1E88E5" text-anchor="middle">Next</text>
  <text x="565" y="306" font-family="Montserrat, sans-serif" font-size="14" fill="#1E88E5">›</text>
  
  <rect x="650" y="280" width="120" height="40" rx="20" ry="20" fill="#1E88E5"/>
  <text x="710" y="306" font-family="Montserrat, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle">Next</text>
  <text x="765" y="306" font-family="Montserrat, sans-serif" font-size="14" fill="#FFFFFF">›</text>
  
  <!-- 03. COLOR PALETTE -->
  <text x="840" y="80" font-family="Montserrat, sans-serif" font-size="16" fill="#757575">Primary Palette</text>
  
  <!-- Primary colors -->
  <circle cx="880" cy="130" r="30" fill="#1E88E5"/>
  <text x="930" y="125" font-family="Open Sans, sans-serif" font-size="14" fill="#424242">Brand Blue</text>
  <text x="930" y="145" font-family="Open Sans, sans-serif" font-size="12" fill="#757575">Hex #1E88E5</text>
  
  <circle cx="880" cy="200" r="30" fill="#43A047"/>
  <text x="930" y="195" font-family="Open Sans, sans-serif" font-size="14" fill="#424242">Brand Green</text>
  <text x="930" y="215" font-family="Open Sans, sans-serif" font-size="12" fill="#757575">Hex #43A047</text>
  
  <circle cx="1050" cy="130" r="30" fill="#FFD54F"/>
  <text x="1100" y="125" font-family="Open Sans, sans-serif" font-size="14" fill="#424242">Brand Yellow</text>
  <text x="1100" y="145" font-family="Open Sans, sans-serif" font-size="12" fill="#757575">Hex #FFD54F</text>
  
  <circle cx="1050" cy="200" r="30" fill="#424242"/>
  <text x="1100" y="195" font-family="Open Sans, sans-serif" font-size="14" fill="#424242">Text Gray</text>
  <text x="1100" y="215" font-family="Open Sans, sans-serif" font-size="12" fill="#757575">Hex #424242</text>
  
  <text x="840" y="250" font-family="Montserrat, sans-serif" font-size="16" fill="#757575">Secondary Palette</text>
  
  <!-- Secondary colors -->
  <circle cx="880" cy="300" r="30" fill="#E91E63"/>
  <text x="930" y="295" font-family="Open Sans, sans-serif" font-size="14" fill="#424242">Raspberry</text>
  <text x="930" y="315" font-family="Open Sans, sans-serif" font-size="12" fill="#757575">Hex #E91E63</text>
  
  <circle cx="880" cy="370" r="30" fill="#FF9800"/>
  <text x="930" y="365" font-family="Open Sans, sans-serif" font-size="14" fill="#424242">Orange</text>
  <text x="930" y="385" font-family="Open Sans, sans-serif" font-size="12" fill="#757575">Hex #FF9800</text>
  
  <circle cx="1050" cy="300" r="30" fill="#90CAF9"/>
  <text x="1100" y="295" font-family="Open Sans, sans-serif" font-size="14" fill="#424242">Light Blue</text>
  <text x="1100" y="315" font-family="Open Sans, sans-serif" font-size="12" fill="#757575">Hex #90CAF9</text>
  
  <circle cx="1050" cy="370" r="30" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
  <text x="1100" y="365" font-family="Open Sans, sans-serif" font-size="14" fill="#424242">White</text>
  <text x="1100" y="385" font-family="Open Sans, sans-serif" font-size="12" fill="#757575">Hex #FFFFFF</text>
  
  <!-- 04. TEXT STYLES -->
  <text x="40" y="480" font-family="Montserrat, sans-serif" font-size="14" fill="#757575">Montserrat</text>
  
  <text x="40" y="520" font-family="Montserrat, sans-serif" font-size="36" font-weight="bold" fill="#424242">Aa</text>
  <text x="40" y="540" font-family="Montserrat, sans-serif" font-size="14" fill="#757575">Bold</text>
  
  <text x="160" y="520" font-family="Montserrat, sans-serif" font-size="36" font-weight="500" fill="#424242">Aa</text>
  <text x="160" y="540" font-family="Montserrat, sans-serif" font-size="14" fill="#757575">Medium</text>
  
  <text x="280" y="520" font-family="Montserrat, sans-serif" font-size="36" font-weight="400" fill="#424242">Aa</text>
  <text x="280" y="540" font-family="Montserrat, sans-serif" font-size="14" fill="#757575">Regular</text>
  
  <text x="40" y="580" font-family="Montserrat, sans-serif" font-size="24" font-weight="bold" fill="#424242">Montserrat Bold 24px</text>
  <text x="40" y="620" font-family="Montserrat, sans-serif" font-size="18" font-weight="bold" fill="#424242">Montserrat Bold 18px</text>
  <text x="40" y="650" font-family="Montserrat, sans-serif" font-size="14" font-weight="bold" fill="#424242">Montserrat Bold 14px</text>
  
  <text x="40" y="690" font-family="Open Sans, sans-serif" font-size="16" fill="#424242">Open Sans Regular 16px</text>
  <text x="40" y="720" font-family="Open Sans, sans-serif" font-size="14" fill="#424242">Open Sans Regular 14px</text>
  <text x="40" y="750" font-family="Nunito, sans-serif" font-size="16" fill="#1E88E5">Nunito Regular 16px (Accent)</text>
  
  <!-- 05. ICONS -->
  <!-- Product icon -->
  <circle cx="480" cy="500" r="25" fill="#1E88E5"/>
  <rect x="465" y="485" width="30" height="15" fill="#FFFFFF" rx="2" ry="2"/>
  <rect x="470" y="505" width="20" height="10" fill="#FFFFFF" rx="2" ry="2"/>
  <text x="480" y="550" font-family="Open Sans, sans-serif" font-size="14" fill="#424242" text-anchor="middle">Product</text>
  
  <!-- Benefits icon -->
  <circle cx="580" cy="500" r="25" fill="#43A047"/>
  <path d="M565 500 L575 510 L595 490" stroke="#FFFFFF" stroke-width="3" fill="none"/>
  <text x="580" y="550" font-family="Open Sans, sans-serif" font-size="14" fill="#424242" text-anchor="middle">Benefits</text>
  
  <!-- Order icon -->
  <circle cx="680" cy="500" r="25" fill="#E91E63"/>
  <rect x="665" y="490" width="30" height="20" fill="none" stroke="#FFFFFF" stroke-width="2" rx="2" ry="2"/>
  <line x1="670" y1="495" x2="690" y2="495" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="670" y1="500" x2="685" y2="500" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="670" y1="505" x2="680" y2="505" stroke="#FFFFFF" stroke-width="2"/>
  <text x="680" y="550" font-family="Open Sans, sans-serif" font-size="14" fill="#424242" text-anchor="middle">Order</text>
  
  <!-- Icon states -->
  <g transform="translate(480, 600)">
    <path d="M0,0 L10,10 L20,0" fill="none" stroke="#BDBDBD" stroke-width="2"/>
    <circle cx="10" cy="20" r="5" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2"/>
  </g>
  <text x="480" y="650" font-family="Open Sans, sans-serif" font-size="14" fill="#424242" text-anchor="middle">Default</text>
  
  <g transform="translate(580, 600)">
    <path d="M0,0 L10,10 L20,0" fill="none" stroke="#1E88E5" stroke-width="2"/>
    <circle cx="10" cy="20" r="5" fill="#FFFFFF" stroke="#1E88E5" stroke-width="2"/>
  </g>
  <text x="580" y="650" font-family="Open Sans, sans-serif" font-size="14" fill="#424242" text-anchor="middle">Hover</text>
  
  <g transform="translate(680, 600)">
    <path d="M0,0 L10,10 L20,0" fill="none" stroke="#1E88E5" stroke-width="2"/>
    <circle cx="10" cy="20" r="5" fill="#1E88E5"/>
  </g>
  <text x="680" y="650" font-family="Open Sans, sans-serif" font-size="14" fill="#424242" text-anchor="middle">Active</text>
  
  <!-- 06. CONTROLS -->
  <text x="840" y="480" font-family="Montserrat, sans-serif" font-size="14" fill="#757575">Toggle</text>
  
  <!-- Toggle off -->
  <rect x="840" y="500" width="60" height="30" rx="15" ry="15" fill="#BDBDBD"/>
  <circle cx="855" cy="515" r="12" fill="#FFFFFF"/>
  
  <!-- Toggle on -->
  <rect x="920" y="500" width="60" height="30" rx="15" ry="15" fill="#1E88E5"/>
  <circle cx="965" cy="515" r="12" fill="#FFFFFF"/>
  
  <text x="840" y="570" font-family="Montserrat, sans-serif" font-size="14" fill="#757575">Add & Subtract Buttons</text>
  
  <!-- Add/subtract controls -->
  <circle cx="860" cy="600" r="20" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2"/>
  <line x1="850" y1="600" x2="870" y2="600" stroke="#424242" stroke-width="2"/>
  
  <circle cx="920" cy="600" r="20" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2"/>
  <line x1="910" y1="600" x2="930" y2="600" stroke="#424242" stroke-width="2"/>
  <line x1="920" y1="590" x2="920" y2="610" stroke="#424242" stroke-width="2"/>
  
  <circle cx="980" cy="600" r="20" fill="#FFFFFF" stroke="#1E88E5" stroke-width="2"/>
  <line x1="970" y1="600" x2="990" y2="600" stroke="#1E88E5" stroke-width="2"/>
  
  <circle cx="1040" cy="600" r="20" fill="#FFFFFF" stroke="#1E88E5" stroke-width="2"/>
  <line x1="1030" y1="600" x2="1050" y2="600" stroke="#1E88E5" stroke-width="2"/>
  <line x1="1040" y1="590" x2="1040" y2="610" stroke="#1E88E5" stroke-width="2"/>
  
  <text x="840" y="650" font-family="Montserrat, sans-serif" font-size="14" fill="#757575">Check Boxes</text>
  
  <!-- Checkboxes -->
  <rect x="850" y="670" width="24" height="24" rx="4" ry="4" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2"/>
  
  <rect x="900" y="670" width="24" height="24" rx="4" ry="4" fill="#FFFFFF" stroke="#1E88E5" stroke-width="2"/>
  <path d="M905 682 L910 687 L920 677" stroke="#1E88E5" stroke-width="2" fill="none"/>
  
  <circle cx="970" cy="682" r="12" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2"/>
  
  <circle cx="1020" cy="682" r="12" fill="#1E88E5"/>
  <path d="M1015 682 L1020 687 L1030 677" stroke="#FFFFFF" stroke-width="2" fill="none"/>

  <!-- Shadow boxes for key UI elements showing hover and active states -->
  <rect x="440" y="710" width="320" height="70" rx="5" ry="5" fill="#F5F5F5"/>
  <text x="600" y="740" font-family="Montserrat, sans-serif" font-size="14" font-weight="bold" fill="#424242" text-anchor="middle">UI STATES FOLLOW CONSISTENT PATTERNS</text>
  <text x="600" y="760" font-family="Open Sans, sans-serif" font-size="12" fill="#757575" text-anchor="middle">Hover: Lighten by 10% | Active: Darken by 10% | Focus: Blue outline</text>
  
  <rect x="840" y="710" width="320" height="70" rx="5" ry="5" fill="#F5F5F5"/>
  <text x="1000" y="740" font-family="Montserrat, sans-serif" font-size="14" font-weight="bold" fill="#424242" text-anchor="middle">RESPONSIVE DESIGN PRINCIPLES</text>
  <text x="1000" y="760" font-family="Open Sans, sans-serif" font-size="12" fill="#757575" text-anchor="middle">All elements use rem units and flex/grid layouts</text>
</svg>
